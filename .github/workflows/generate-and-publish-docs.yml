name: Compile and publish documentation to GitHub pages

on:
  push:
    paths:
      - ".github/workflows/generate-and-publish-docs.yml"
      - "examples/**"
      - "src/**"
      - "doxygen.conf"
    branches: 
      - main
      - examples
      - actions
  pull_request:
    paths:
      - ".github/workflows/generate-and-publish-docs.yml"
      - "examples/**"
      - "src/**"
      - "doxygen.conf"
    branches: 
      - main
  schedule:
    # Run every Tuesday at 8 AM UTC to catch breakage caused by changes to external resources (stm32duino).
    - cron: "0 8 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Doxygen files
        uses: mattnotmitt/doxygen-action@v1.9.5
        with:
            working-directory: '.'
            doxyfile-path: './doxygen.conf'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./doxygen/html