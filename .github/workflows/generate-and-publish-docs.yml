name: Compile Examples

on:
  push:
    paths:
      - ".github/workflows/generate-and-publish-docs.yml"
      - "examples/**"
      - "src/**"
    branches: 
      - main
      - examples
      - actions
  pull_request:
    paths:
      - ".github/workflows/generate-and-publish-docs.yml"
      - "examples/**"
      - "src/**"
    branches: 
      - main
      - staging
  schedule:
    # Run every Tuesday at 8 AM UTC to catch breakage caused by changes to external resources (stm32duino).
    - cron: "0 8 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn:
          - STMicroelectronics:stm32:GenF1:pnum=BLUEPILL_F103C8
          - STMicroelectronics:stm32:GenH7:pnum=GENERIC_H750VBTX
          - arduino:avr:uno
          - MiniCore:avr:328:variant=modelPB
    steps:
      - uses: actions/checkout@v4

      - name: Generate Doxygen files
        uses: mattnotmitt/doxygen-action@v1.9.5
        with:
            working-directory: 'submodule/'
            doxyfile-path: 'docs/Doxygen'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./doxygen/html