name: Publish Doxygen documentation

on:
  push:
    tags: 
      - "v*"
  workflow_dispatch:
  repository_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          mkdir ./doc
          echo "OUTPUT_DIRECTORY=./doc/${{ github.ref_name }}" >> ./doxygen.conf
          echo "PROJECT_NUMBER=${{ github.ref_name }}" >> ./doxygen.conf  

      - name: Generate Doxygen files
        uses: mattnotmitt/doxygen-action@edge
        with:
          working-directory: '.'
          doxyfile-path: './doxygen.conf'

      # - run: |
      #     cp ./doc/${{ github.ref_name }}/html/* -R ./doc/${{ github.ref_name }}/


      - name: Upload generated docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'IntroSatLib-docs-${{github.ref_name}}'
          path: './doxygen/'

      - name: Generate Directory Listings
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: doc # Directory to generate index for
      
      - name: Deploy Doxygen files to GH Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          destination_dir: ./doc
